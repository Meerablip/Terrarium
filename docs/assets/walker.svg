<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" width="320" height="96" shape-rendering="crispEdges">
  <title>Terrarium citizen, walking</title>

  <!-- beige ground strip, matching the sim's canvas background -->
  <rect x="0" y="0" width="160" height="48" fill="#EDE6D6"/>
  <rect x="0" y="40" width="160" height="8" fill="#DCD2BC"/>
  <rect x="0" y="40" width="160" height="2" fill="#C7B89A" opacity="0.6"/>

  <!-- four sun-baked terrain pixels drifting by, purely decorative -->
  <rect x="18" y="10" width="4" height="4" fill="#C9BC9F" opacity="0.5"/>
  <rect x="70" y="6" width="4" height="4" fill="#C9BC9F" opacity="0.5"/>
  <rect x="118" y="14" width="4" height="4" fill="#C9BC9F" opacity="0.5"/>

  <!-- walking pixel figure, 8x12 blocky sprite, 4 walk-cycle frames -->
  <g>
    <!-- frame 1: legs together -->
    <g fill="#1A1A1A">
      <rect x="12" y="20" width="8" height="8"/>   <!-- head -->
      <rect x="10" y="28" width="12" height="8"/>  <!-- body -->
      <rect x="10" y="36" width="4" height="4"/>   <!-- left foot -->
      <rect x="18" y="36" width="4" height="4"/>   <!-- right foot -->
    </g>
    <!-- frame 2: stride forward -->
    <g fill="#1A1A1A" opacity="0">
      <rect x="12" y="20" width="8" height="8"/>
      <rect x="10" y="28" width="12" height="8"/>
      <rect x="6"  y="36" width="4" height="4"/>
      <rect x="22" y="36" width="4" height="4"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0;0;0" dur="0.8s" repeatCount="indefinite"/>
    </g>
    <!-- frame 3: legs together (mirrored contact) -->
    <g fill="#1A1A1A" opacity="0">
      <rect x="12" y="20" width="8" height="8"/>
      <rect x="10" y="28" width="12" height="8"/>
      <rect x="10" y="36" width="4" height="4"/>
      <rect x="18" y="36" width="4" height="4"/>
      <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" dur="0.8s" repeatCount="indefinite"/>
    </g>
    <!-- frame 4: stride back -->
    <g fill="#1A1A1A" opacity="0">
      <rect x="12" y="20" width="8" height="8"/>
      <rect x="10" y="28" width="12" height="8"/>
      <rect x="22" y="36" width="4" height="4"/>
      <rect x="6"  y="36" width="4" height="4"/>
      <animate attributeName="opacity" values="0;0;0;0;0;0;1;1" dur="0.8s" repeatCount="indefinite"/>
    </g>
    <!-- base frame 1, faded back in on the last beat -->
    <g fill="#1A1A1A" opacity="0">
      <rect x="12" y="20" width="8" height="8"/>
      <rect x="10" y="28" width="12" height="8"/>
      <rect x="10" y="36" width="4" height="4"/>
      <rect x="18" y="36" width="4" height="4"/>
      <animate attributeName="opacity" values="1;1;0;0;0;0;0;0" dur="0.8s" repeatCount="indefinite"/>
    </g>

    <!-- walk translation: the whole figure paces across the strip and loops -->
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 140,0; 140,0; 0,0" keyTimes="0; 0.47; 0.5; 1"
      dur="4s" repeatCount="indefinite"/>
  </g>
</svg>
